<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apostille Compliance Report</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-50 p-6">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-2xl font-bold mb-6">
        Art. 5 Hague Convention - Field 3 Missing
      </h1>

      <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="min-w-full">
          <thead class="bg-gray-100">
            <tr>
              <th class="p-3 text-left">Code</th>
              <th class="p-3 text-left">Authority</th>
              <th class="p-3 text-left">Action</th>
            </tr>
          </thead>
          <tbody id="table"></tbody>
        </table>
      </div>
    </div>

    <script>
      const violations = [
        { code: 'DLTP7B8ZHWGQ7', auth: 'Directia de Arhiva' },
        { code: 'CG0T6Y1TBUEL7', auth: 'Curtea Suprema' },
        { code: '5PWVD5A28PBS8', auth: 'Directia de Arhiva' },
        { code: 'DFVMD2FQLW5N3', auth: 'Directia de Arhiva' },
        { code: 'HQ7X9W62GUJL9', auth: 'Penitenciarul Nr.15' },
        { code: 'BS7XCZF1EUJG3', auth: 'Directia de Arhiva' },
        { code: '4O3WF02QGRCI1', auth: 'Directia de Arhiva' },
        { code: 'DQ1N892ZFXDI3', auth: 'Directia de Arhiva' },
        { code: '6R2V5Z4XBZBH8', auth: 'Directia de Politie' },
        { code: 'IT1PD8E29S5F5', auth: 'Directia de Arhiva' },
        { code: '4J20E98WFY7J2', auth: 'Directia de Arhiva' },
        { code: '6OZUD89VBUEJ3', auth: 'Directia Generala Locativ' },
        { code: 'IHW093CZ8U8R7', auth: 'Directia de Arhiva' },
      ];

      const table = document.getElementById('table');

      violations.forEach((v) => {
        const row = document.createElement('tr');
        row.className = 'border-t hover:bg-red-50';

        // CORRECT PATH: Downloads/Apostilles/CODE_EVIDENCE.pdf
        const url = `https://arhiv1973b.github.io/maceret-case-evidence/Downloads/Apostilles/${v.code}_EVIDENCE.pdf`;

        row.innerHTML = `
                <td class="p-3 font-mono">${v.code}</td>
                <td class="p-3">${v.auth}</td>
                <td class="p-3"><a href="${url}" target="_blank" class="text-blue-600 hover:underline">View PDF</a></td>
            `;
        table.appendChild(row);
      });
    </script>
  </body>
</html>

name: TI-ULA Autonomous Investigation Agent

on:
  workflow_dispatch:
    inputs:
      investigation_target:
        description: 'Target identifier (1-80 ASCII letters, digits, underscores, or dashes)'
        required: true
        default: 'APOSTILLE-MEDICAL-TORTURE-NEXUS'
        type: string

permissions:
  contents: write

jobs:
  security-tests-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned dependency
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Run containment and encoding tests
        env:
          PYTHONPATH: .github/scripts
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Generate manifest safely
        id: generate
        env:
          RAW_TARGET: ${{ inputs.investigation_target }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          output="$(python .github/scripts/ti_ula_manifest.py "$RAW_TARGET" "$RUN_ID" "$GITHUB_WORKSPACE")"
          printf 'generated_file=%s\n' "$output" >> "$GITHUB_OUTPUT"
          printf 'Generated manifest: %s\n' "$output"

      - name: Stage only generated file and verify isolation
        env:
          GENERATED_FILE: ${{ steps.generate.outputs.generated_file }}
        run: |
          set -euo pipefail
          test -n "$GENERATED_FILE"
          git add -- "$GENERATED_FILE"
          mapfile -t staged_files < <(git diff --cached --name-only)
          if [[ "${#staged_files[@]}" -ne 1 || "${staged_files[0]}" != "$GENERATED_FILE" ]]; then
            echo 'ERROR: staged changes are not isolated to the generated manifest.' >&2
            git diff --cached --name-only >&2
            exit 1
          fi

      - name: Commit and push generated manifest
        env:
          GENERATED_FILE: ${{ steps.generate.outputs.generated_file }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'A©t0r Investigation Bot'
          git config user.email 'arhiv1973b@users.noreply.github.com'
          git commit -m 'Add unverified TI-ULA investigation manifest [skip ci]'
          git push

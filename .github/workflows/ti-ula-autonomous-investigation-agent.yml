name: TI-ULA Safe Manifest

on:
  push:
    paths:
      - '.github/scripts/**'
      - '.github/workflows/ti-ula-autonomous-investigation-agent.yml'
  workflow_dispatch:
    inputs:
      investigation_target:
        description: 'Target identifier (1-80 ASCII letters, digits, underscores, or dashes)'
        required: true
        default: 'APOSTILLE-MEDICAL-TORTURE-NEXUS'
        type: string

permissions:
  contents: read

jobs:
  test-and-generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pinned dependency
        run: python -m pip install 'PyYAML==6.0.2'

      - name: Run filesystem and UTF-8 security tests
        env:
          PYTHONPATH: .github/scripts
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

      - name: Generate unverified manifest for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          RAW_TARGET: ${{ inputs.investigation_target }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python .github/scripts/ti_ula_manifest.py "$RAW_TARGET" "$RUN_ID" "$GITHUB_WORKSPACE"

      - name: Upload generated manifest
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ti-ula-unverified-manifest-${{ github.run_id }}
          path: manifests/INVESTIGATION_AGENT_${{ inputs.investigation_target }}_${{ github.run_id }}.yaml
          if-no-files-found: error

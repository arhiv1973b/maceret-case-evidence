  subject: "User-provided account of a scientific linguistic evaluation concerning surname and forename variants"
  user_reported_findings:
    - "The user reports that the surname MACERET (ALEXEI), in Moldovan official documents, is recognized as a variant of the Hebrew-origin surname МАЧЕРЕТ, transcribed in Russian during the Soviet period pursuant to language function norms (Law of 31 August 1989)."

      let currentFilter = 'all';

      function getPdfUrl(code) {
          return `https://arhiv1973b.github.io/maceret-case-evidence/Downloads/Apostilles/${code}_EVIDENCE.pdf`;
      }

      function renderTable(filter = 'all') {
          currentFilter = filter;
          tableBody.innerHTML = '';

          const filtered = filter === 'violations' ? apostilles.filter(a => a.violation) :
                         filter === 'valid' ? apostilles.filter(a => !a.violation) :
                         apostilles;

          filtered.forEach(a => {
              const row = document.createElement('tr');
              row.className = a.violation ? 'violation' : 'valid';
              row.innerHTML = `
                  <td class="p-3 font-mono text-sm">${a.code}</td>
                  <td class="p-3 text-sm">${a.date}</td>
                  <td class="p-3 text-sm">${a.auth}</td>
                  <td class="p-3 text-sm ${a.sig === 'indescifrabila' ? 'text-red-600 font-bold' : 'text-green-600'}">${a.sig}</td>
                  <td class="p-3 text-sm">${a.pos}</td>
                  <td class="p-3">
                      <span class="px-2 py-1 text-xs rounded ${a.violation ? 'bg-red-200 text-red-800' : 'bg-green-200 text-green-800'}">

                      </span>
                  </td>
                  <td class="p-3">
                      <a href="${getPdfUrl(a.code)}" target="_blank" class="text-blue-600 hover:underline text-sm">PDF</a>
                  </td>
              `;
              tableBody.appendChild(row);
          });
      }

      function searchApostille() {
          const code = document.getElementById('searchCode').value.toUpperCase().trim();
          const result = document.getElementById('result');

          const found = apostilles.find(a => a.code === code);

          if (found) {
              result.className = `mb-6 p-4 rounded-lg ${found.violation ? 'violation' : 'valid'}`;
              result.innerHTML = `
                  <div class="flex justify-between items-start">
                      <div>
                          <h3 class="font-bold text-lg">${found.code}</h3>
                          <p class="text-sm">${found.date} | ${found.auth}</p>
                          <div class="mt-2 grid grid-cols-2 gap-4 text-sm">
                              <div>Подпись: <span class="${found.sig === 'indescifrabila' ? 'text-red-600 font-bold' : 'text-green-600'}">${found.sig}</span></div>
                              <div>Должность: <span class="font-mono">${found.pos}</span></div>
                          </div>
                      </div>
                      <div class="text-right">
                          <span class="px-3 py-1 rounded text-sm ${found.violation ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}">
                              ${found.violation ? 'НАРУШЕНИЕ СТ.5' : 'ДЕЙСТВИТЕЛЕН'}
                          </span>
                          <a href="${getPdfUrl(found.code)}" target="_blank" class="block mt-2 text-blue-600 hover:underline">Скачать PDF</a>
                      </div>
                  </div>
              `;
          } else {
              result.className = 'mb-6 p-4 rounded-lg bg-yellow-100 border border-yellow-400';
              result.innerHTML = `Апостиль с кодом <strong>${code}</strong> не найден в базе. Проверьте правильность кода.`;
          }
          result.classList.remove('hidden');
      }

      function showViolations() { renderTable('violations'); }
      function showValid() { renderTable('valid'); }
      function showAll() { renderTable('all'); }

      document.getElementById('searchCode').addEventListener('keypress', function(e) {
          if (e.key === 'Enter') searchApostille();
      });
